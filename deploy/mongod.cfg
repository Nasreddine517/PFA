# Configuration MongoDB portable pour NeuroScan
# Ce fichier est lu par mongod.exe au démarrage

storage:
  dbPath: data/db
  journal:
    enabled: true

net:
  port: 27017
  bindIp: 127.0.0.1

systemLog:
  destination: file
  path: ../logs/mongodb.log
  logAppend: true

processManagement:
  windowsService:
    serviceName: NeuroScanDB
